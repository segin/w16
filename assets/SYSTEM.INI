; w16's default SYSTEM.INI (installed as WINDOWS\SYSTEM.INI by
; `make install-tree`). Its layout follows Windows 3.1's; every driver and
; font it names is one w16 ships in WINDOWS\SYSTEM.
[boot]
shell=progman.exe
system.drv=system.drv
keyboard.drv=keyboard.drv
mouse.drv=mouse.drv
display.drv=vga.drv
comm.drv=comm.drv
sound.drv=
network.drv=
language.dll=
fonts.fon=vgasys.fon
fixedfon.fon=vgafix.fon
oemfonts.fon=vgaoem.fon
286grabber=vgacolor.2gr
386grabber=vga.3gr
drivers=

[keyboard]
type=4
subtype=
keyboard.dll=
oemansi.bin=

[boot.description]
keyboard.typ=Enhanced 101 or 102 key US and Non US keyboards
mouse.drv=PS/2 mouse
network.drv=No Network Installed
language.dll=English (American)
system.drv=MS-DOS System
codepage=437
aspect=100,96,96
display.drv=VGA

[standard]

[386Enh]

[NonWindowsApp]

; w16's own settings (ARCHITECTURE.md 6.8); the values below are the
; defaults, written out so they are easy to change.
[w16]
; the version stamp in the desktop's corner (0: stock Windows 3.1 desktop)
DesktopVersion=1
; the scroll-bar right-click menu (0: stock Windows 3.1)
ScrollBarMenu=1
; OutputDebugString text to AUX even when AUX is the console (1: stock)
DebugToAux=0
; more windows and GDI objects than Windows 3.1 allows; may break programs
; that read USER's or GDI's internal structures (0: stock)
ExtendedUserHeap=0
ExtendedGdiHeap=0
