; w16's default SYSTEM.INI (installed as SYSTEM.INI in the w16 directory, e.g. C:\W16, by
; `make install-tree`). Its layout follows Windows 3.1's; every driver and
; font it names is one w16 ships in its SYSTEM directory.
[boot]
shell=progman.exe
system.drv=system.drv
keyboard.drv=keyboard.drv
mouse.drv=mouse.drv
display.drv=vga.drv
comm.drv=comm.drv
sound.drv=mmsound.drv
network.drv=
language.dll=
fonts.fon=vgasys.fon
fixedfon.fon=vgafix.fon
oemfonts.fon=vgaoem.fon
286grabber=vgacolor.2gr
386grabber=vga.3gr
; w16's MMSYSTEM.DLL, the multimedia system library (README.TXT); it
; opens the timer driver of [drivers] below
drivers=mmsystem.dll

[keyboard]
type=4
subtype=
keyboard.dll=
oemansi.bin=

[boot.description]
keyboard.typ=Enhanced 101 or 102 key US and Non US keyboards
mouse.drv=PS/2 mouse
network.drv=No Network Installed
language.dll=English (American)
system.drv=MS-DOS System
codepage=437
aspect=100,96,96
display.drv=VGA

[drivers]
; a Sound Blaster 16 (or compatible): w16's SB16.DRV; without a card,
; and in 386 Enhanced mode, it offers no devices
wave=sb16.drv
midi=sb16.drv
aux=sb16.drv
; MMSYSTEM's timer: w16's TIMER.DRV
timer=timer.drv

[standard]

[386Enh]
; 386 Enhanced mode (WIN /3): w16's WIN386.EXE loads the devices named here;
; a *name is one built into WIN386.EXE (as Windows 3.1's Setup writes them)
mouse=*vmd
keyboard=*vkd
display=*vddvga
ebios=*ebios
device=*vpicd
device=*vtd
device=*reboot
device=*vdmad
device=*vsd
device=*v86mmgr
device=*pageswap
device=*dosmgr
device=*vmpoll
device=*wshell
device=*BLOCKDEV
device=*PAGEFILE
device=*vfd
device=*parity
device=*biosxlat
device=*vcd
device=*vmcpd
device=*combuff

[NonWindowsApp]

; w16's own settings (ARCHITECTURE.md 6.8); the values below are the
; defaults, written out so they are easy to change.
[w16]
; the version stamp in the desktop's corner (0: stock Windows 3.1 desktop)
DesktopVersion=1
; the scroll-bar right-click menu (0: stock Windows 3.1)
ScrollBarMenu=1
; OutputDebugString text to AUX even when AUX is the console (1: stock)
DebugToAux=0
; more windows and GDI objects than Windows 3.1 allows; may break programs
; that read USER's or GDI's internal structures (0: stock)
ExtendedUserHeap=0
ExtendedGdiHeap=0
