; w16's default WIN.INI (installed as WIN.INI in the w16 directory, e.g. C:\W16, by
; `make install-tree`). Its layout and default values follow Windows 3.1's;
; it names only programs and fonts w16 ships.
[windows]
spooler=yes
load=
run=
Beep=yes
NullPort=None
device=
BorderWidth=3
CursorBlinkRate=530
DoubleClickSpeed=452
Programs=com exe bat pif
Documents=
DeviceNotSelectedTimeout=15
TransmissionRetryTimeout=45
KeyboardDelay=2
KeyboardSpeed=31
ScreenSaveActive=0
ScreenSaveTimeOut=120

[Desktop]
Pattern=(None)
Wallpaper=(None)
GridGranularity=0

[Extensions]
crd=cardfile.exe ^.crd
txt=notepad.exe ^.txt
ini=notepad.exe ^.ini
wri=write.exe ^.wri

[intl]
sLanguage=enu
sCountry=United States
iCountry=1
iDate=0
iTime=0
iTLZero=0
iCurrency=0
iCurrDigits=2
iNegCurr=0
iLzero=1
iDigits=2
iMeasure=1
s1159=AM
s2359=PM
sCurrency=$
sThousand=,
sDecimal=.
sDate=/
sTime=:
sList=,
sShortDate=M/d/yy
sLongDate=dddd, MMMM dd, yyyy

[ports]
LPT1:=
LPT2:=
LPT3:=
COM1:=9600,n,8,1,x
COM2:=9600,n,8,1,x
COM3:=9600,n,8,1,x
COM4:=9600,n,8,1,x
EPT:=
FILE:=
LPT1.DOS=
LPT2.DOS=

[FontSubstitutes]
Helv=MS Sans Serif
Tms Rmn=MS Serif
Times=Liberation Serif
Helvetica=Liberation Sans
Arial=Liberation Sans
Times New Roman=Liberation Serif
Courier New=Liberation Mono

[fonts]
Liberation Sans (TrueType)=LIBSANS.FOT
Liberation Sans Bold (TrueType)=LIBSANSB.FOT
Liberation Sans Bold Italic (TrueType)=LIBSANSZ.FOT
Liberation Sans Italic (TrueType)=LIBSANSI.FOT
Liberation Mono (TrueType)=LIBMONO.FOT
Liberation Mono Bold (TrueType)=LIBMONOB.FOT
Liberation Mono Bold Italic (TrueType)=LIBMONOZ.FOT
Liberation Mono Italic (TrueType)=LIBMONOI.FOT
Liberation Serif (TrueType)=LIBSERF.FOT
Liberation Serif Bold (TrueType)=LIBSERFB.FOT
Liberation Serif Bold Italic (TrueType)=LIBSERFZ.FOT
Liberation Serif Italic (TrueType)=LIBSERFI.FOT
MS Sans Serif 8,10,12,14,18,24 (VGA res)=SSERIFE.FON
Courier 10,12,15 (VGA res)=COURE.FON
MS Serif 8,10,12,14,18,24 (VGA res)=SERIFE.FON
Symbol 8,10,12,14,18,24 (VGA res)=SYMBOLE.FON
Small Fonts (VGA res)=SMALLE.FON
w16 Sans (TrueType)=W16SANS.FOT
w16 Sans Bold (TrueType)=W16SANBD.FOT
w16 Sans Italic (TrueType)=W16SANIT.FOT
w16 Sans Bold Italic (TrueType)=W16SANBI.FOT
w16 Serif (TrueType)=W16SERIF.FOT
w16 Serif Bold (TrueType)=W16SERBD.FOT
w16 Serif Italic (TrueType)=W16SERIT.FOT
w16 Serif Bold Italic (TrueType)=W16SERBI.FOT
w16 Mono (TrueType)=W16MONO.FOT
w16 Mono Bold (TrueType)=W16MONBD.FOT
w16 Mono Italic (TrueType)=W16MONIT.FOT
w16 Mono Bold Italic (TrueType)=W16MONBI.FOT

[embedding]
