; w16's default WIN.INI (installed as WIN.INI in the w16 directory, e.g. C:\W16, by
; `make install-tree`). Its layout and default values follow Windows 3.1's;
; it names only programs and fonts w16 ships.
[windows]
spooler=yes
load=
run=
Beep=yes
NullPort=None
device=
BorderWidth=3
CursorBlinkRate=530
DoubleClickSpeed=452
Programs=com exe bat pif
Documents=
DeviceNotSelectedTimeout=15
TransmissionRetryTimeout=45
KeyboardDelay=2
KeyboardSpeed=31
ScreenSaveActive=0
ScreenSaveTimeOut=120

[Desktop]
Pattern=(None)
Wallpaper=(None)
GridGranularity=0

[Extensions]
crd=cardfile.exe ^.crd
txt=notepad.exe ^.txt
ini=notepad.exe ^.ini

[intl]
sLanguage=enu
sCountry=United States
iCountry=1
iDate=0
iTime=0
iTLZero=0
iCurrency=0
iCurrDigits=2
iNegCurr=0
iLzero=1
iDigits=2
iMeasure=1
s1159=AM
s2359=PM
sCurrency=$
sThousand=,
sDecimal=.
sDate=/
sTime=:
sList=,
sShortDate=M/d/yy
sLongDate=dddd, MMMM dd, yyyy

[ports]
LPT1:=
LPT2:=
LPT3:=
COM1:=9600,n,8,1,x
COM2:=9600,n,8,1,x
COM3:=9600,n,8,1,x
COM4:=9600,n,8,1,x
EPT:=
FILE:=
LPT1.DOS=
LPT2.DOS=

[FontSubstitutes]
Helv=MS Sans Serif

[fonts]
MS Sans Serif 8,10,12,14,18,24 (VGA res)=SSERIFE.FON

[embedding]
