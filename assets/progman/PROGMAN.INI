; w16's default PROGMAN.INI (installed as PROGMAN.INI in the w16 directory,
; C:\W16, by `make install-tree`, with the group files beside it). Laid
; out as Windows 3.1 Setup writes it: Program Manager's window, the display
; driver the groups' icons were cached for, and the groups bottom first in
; Order (Main on top).
[Settings]
Window=68 48 580 384 1
display.drv=vga.drv
Order= 2 3 1

[Groups]
Group1=C:\W16\MAIN.GRP
Group2=C:\W16\ACCESSOR.GRP
Group3=C:\W16\STARTUP.GRP
